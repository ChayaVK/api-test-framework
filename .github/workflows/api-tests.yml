name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium

      # Playwright starts the practice API itself (webServer in playwright.config.ts)
      - name: Run all tests
        run: npx playwright test

      - name: Upload the HTML report
        if: always()            # also when tests failed: that is when you need it
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results/junit.xml
